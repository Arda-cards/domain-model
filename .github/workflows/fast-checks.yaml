# Registered on GitHub by this touch (R02-D13, MP 2026-10-02, option A): the file predates the repository's creation on GitHub and had never run.
# Tier 1 — fast PR checks (seconds to minutes): the three text gates (the layering lint,
# the open-parameters gate, the lifecycle shape partition), shell hygiene, and the pinned-tools
# checksum. No solver work here; that is affected-cones.yaml. The text gates run on EVERY pull
# request, whatever its labels: tools/test-ci-text-gates.py holds that.
name: fast-checks

on:
  pull_request:

concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: CI workflow regression tests (mocked GitHub API and Java)
        run: |
          python3 tools/test-ci-advisory.py -v
          python3 tools/test-ci-solver.py -v
          python3 tools/test-ci-text-gates.py -v

  layering-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: DT-001.12 layer law + DT-017 mock discipline
        run: make check-layering

  open-params-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: model-gate rule 10 — every parameter of a parametric open is alias-qualified or declared locally
        run: make check-open-params

  lifecycle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: DT-030 shape partition — every concrete kind of a lifecycle adopter sits under a shape
        run: make check-lifecycle

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck tools/*.sh (error severity)
        run: shellcheck -S error tools/*.sh

  tools-checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            tools/alloy.jar
            tools/robot.jar
          key: tools-${{ hashFiles('tools/get-tools.sh') }}
      - name: fetch + SHA-256 verify the pinned jars
        run: make tools
