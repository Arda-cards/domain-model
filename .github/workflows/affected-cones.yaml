# Registered on GitHub by the R02-D13 (A) touch (MP 2026-10-02); budget + advisory comment per MP's R02-D13 follow-up ruling (2026-10-02).
# Tier 2 — cone-aware PR gate, REQUIRED on every PR: run every test root whose open-cone
# touches an alloy file the PR changed (make check-affected). Two paths:
#   * `heavy-cone` label set — the solve is skipped (escape valve, MP ruling 2026-08-15: for
#     PRs whose cones exceed the CI budget by construction, e.g. anything reaching the
#     receiver unit root). The label is an operator ASSERTION that the local full gate
#     (`make check-alloy`) ran green on the PR head; the advisory job posts a comment saying
#     so, and the PR body must cite that run (its label, end line and SHA).
#   * label not set — the cone runs under the CONE_BUDGET wall budget (15 minutes) inside a
#     20-minute job; on exhaustion the job FAILS EXPLICITLY (error annotation + exit 1, never a
#     silent timeout) and the advisory job says what to do.
# NOT the full gate: `make check-alloy` remains the local push discipline; the CI form of the
# whole suite is full-regression.yaml — on demand, not a gate.
# TWO JOBS, by design (Copilot on PR #4): `check-affected` runs PR-controlled code (make tools,
# the solver probe, make check-affected) with a READ-ONLY token and no persisted credentials,
# and decides the verdict; `advisory` is the only job with `pull-requests: write` — a fresh
# runner, no checkout, no PR code; only the outcome word crosses the job boundary, and it only
# selects the comment's TEXT (the verdict is the first job's exit status). The advisory is ONE
# comment per PR, keyed by a hidden marker and authored by the Actions bot, updated in place on
# every run (never a new comment per synchronize); a clean PR never gets one.
name: affected-cones

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: affected-cones-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # the workflow default; only the advisory job raises pull-requests: write, for itself

env:
  CONE_BUDGET: 15m # wall budget for the cone run (MP: "At the 15 minute mark, if not complete, place an advisory comment in the PR and fail the build explicitly")

jobs:
  check-affected: # the REQUIRED check — PR-controlled code runs here, with no write-capable token in reach
    runs-on: ubuntu-latest
    timeout-minutes: 20 # MP: "Limit to 20 minutes in GHA" — setup + CONE_BUDGET fit inside
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.label.outputs.outcome || steps.cone.outputs.outcome }} # label | within-budget | exhausted | verdict-failed
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: heavy-cone escape valve — skip the solve (label = operator assertion of a green local full gate)
        id: label
        if: contains(github.event.pull_request.labels.*.name, 'heavy-cone')
        run: |
          echo "heavy-cone label set — this PR's cones exceed the CI budget by construction; the CI cone run is skipped."
          echo "Evidence discipline: the PR body must cite the green local 'make check-alloy' run on the PR head (the advisory job says so on the PR)."
          echo "outcome=label" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        with:
          fetch-depth: 0
          persist-credentials: false # the PR-controlled commands below must not find a token in .git/config
      - uses: actions/setup-java@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        with:
          path: |
            tools/alloy.jar
            tools/robot.jar
          key: tools-${{ hashFiles('tools/get-tools.sh') }}
      - run: make tools
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
      - name: pick solver (glucose native, else pure-Java SAT4J — both sound/complete)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        run: |
          printf 'sig A {}\nrun probe { some A } for 2 expect 1\n' > /tmp/probe.als
          mkdir -p /tmp/probe-out
          if java -jar tools/alloy.jar exec -s glucose -c probe -o /tmp/probe-out -f /tmp/probe.als >/dev/null 2>&1; then
            echo "ALLOY_FLAGS=-s glucose" >> "$GITHUB_ENV"
            echo "solver: glucose (native loaded)"
          else
            echo "ALLOY_FLAGS=" >> "$GITHUB_ENV"
            echo "solver: SAT4J (glucose native failed to load on this runner)"
          fi
      - name: run the roots whose cones this PR touched (CONE_BUDGET wall budget; explicit failure on exhaustion)
        id: cone
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        run: |
          files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- alloy | tr '\n' ' ')"
          echo "changed alloy files: ${files:-none}; cone budget: $CONE_BUDGET (job limit 20 min)"
          set +e
          timeout -k 20s "$CONE_BUDGET" make check-affected FILES="$files"
          rc=$?
          set -e
          # the outcome word only selects the advisory's text; the verdict is this step's exit status, which PR code cannot alter
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "outcome=exhausted" >> "$GITHUB_OUTPUT"
            echo "::error::affected-cones: the cone run exceeded its $CONE_BUDGET budget on $HEAD_SHA — run make check-alloy locally on this head, cite the green run in the PR body, and apply the heavy-cone label"
            exit 1
          elif [ "$rc" -eq 0 ]; then
            echo "outcome=within-budget" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=verdict-failed" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

  advisory: # the ONLY job with a write token — a fresh runner, no checkout, no PR code; advisory only, never the verdict
    needs: check-affected
    if: ${{ always() && needs.check-affected.outputs.outcome != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    continue-on-error: true # a failed post (e.g. a read-only token on a fork PR) never colours the PR; the verdict is check-affected's
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OUTCOME: ${{ needs.check-affected.outputs.outcome }}
    steps:
      - name: create or update the one marker-keyed advisory comment, by outcome
        run: |
          marker='<!-- affected-cones-advisory -->'
          footer='*Posted by the affected-cones workflow; updated in place on every run.*'
          mode=create # create-or-update; "update" = only an existing comment is refreshed (a clean PR never gets one)
          case "$OUTCOME" in
            label)
              body="> [!note]
          > **affected-cones: the CI cone run was skipped on the \`heavy-cone\` label** — head \`$HEAD_SHA\`, [run]($RUN_URL).
          > The label is an operator assertion, not evidence. Before merge, the PR body must cite the green local \`make check-alloy\` run on this head: its label, its end line and the SHA it ran at." ;;
            exhausted)
              body="> [!warning]
          > **affected-cones: the cone run exceeded its $CONE_BUDGET budget** on head \`$HEAD_SHA\` ([run]($RUN_URL)); the check was failed explicitly.
          > Run \`make check-alloy\` locally on this head (or \`make check-affected\` for the cone), cite the green run in the PR body (its label, end line and SHA), and apply the \`heavy-cone\` label; the check then passes through the label and this advisory is updated." ;;
            within-budget)
              mode=update
              body="> [!note]
          > **affected-cones: the cone run completed within its $CONE_BUDGET budget** on head \`$HEAD_SHA\` ([run]($RUN_URL)). No local evidence or \`heavy-cone\` label is needed for this head; earlier advisories on this PR are superseded." ;;
            verdict-failed)
              mode=update
              body="> [!warning]
          > **affected-cones: the cone run FAILED on a verdict** (not the budget) on head \`$HEAD_SHA\` ([run]($RUN_URL)). See the run's Alloy output; local evidence or the \`heavy-cone\` label does not answer a verdict failure." ;;
            *)
              echo "unknown outcome '$OUTCOME' — nothing posted"; exit 0 ;;
          esac
          printf '%s\n%s\n>\n> %s\n' "$marker" "$body" "$footer" > advisory.md
          # only a comment AUTHORED BY THE ACTIONS BOT counts: the marker alone is user-controlled text
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@advisory.md > /dev/null
            echo "advisory comment updated: #$id ($OUTCOME)"
          elif [ "$mode" = "update" ]; then
            echo "no advisory comment on this PR; nothing to update ($OUTCOME)"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@advisory.md > /dev/null
            echo "advisory comment posted ($OUTCOME)"
          fi
