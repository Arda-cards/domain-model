# Registered on GitHub by this touch (R02-D13, MP 2026-10-02, option A): the file predates the repository's creation on GitHub and had never run.
# Tier 2 — cone-aware PR gate: run every test root whose open-cone touches an alloy
# file the PR changed (make check-affected). Bounded by the job timeout — an over-cap
# failure means "this PR's cones are too heavy for CI; run the full gate locally"
# (the same budget-cap philosophy as the soak watchdog, PDEV-1610). NOT the full gate:
# `make check-alloy` remains the local push discipline, and full-gate.yaml the CI form.
# Escape valve (MP ruling 2026-08-15): the `heavy-cone` label short-circuits the solve —
# for PRs whose cones exceed the CI budget by construction (e.g. anything reaching the
# receiver unit root). The label is an operator assertion that the local full gate ran
# green on the PR head; cite the run in the PR body. The check stays required for every
# unlabeled PR.
name: affected-cones

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: affected-cones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-affected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: heavy-cone escape valve (label = operator assertion of a green local full gate)
        if: contains(github.event.pull_request.labels.*.name, 'heavy-cone')
        run: |
          echo "heavy-cone label set — this PR's cones exceed the CI budget by construction."
          echo "Evidence discipline: the local 'make check-alloy' full gate ran green on the PR head (see the PR body)."
      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        with:
          path: |
            tools/alloy.jar
            tools/robot.jar
          key: tools-${{ hashFiles('tools/get-tools.sh') }}
      - run: make tools
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
      - name: pick solver (glucose native, else pure-Java SAT4J — both sound/complete)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        run: |
          printf 'sig A {}\nrun probe { some A } for 2 expect 1\n' > /tmp/probe.als
          mkdir -p /tmp/probe-out
          if java -jar tools/alloy.jar exec -s glucose -c probe -o /tmp/probe-out -f /tmp/probe.als >/dev/null 2>&1; then
            echo "ALLOY_FLAGS=-s glucose" >> "$GITHUB_ENV"
            echo "solver: glucose (native loaded)"
          else
            echo "ALLOY_FLAGS=" >> "$GITHUB_ENV"
            echo "solver: SAT4J (glucose native failed to load on this runner)"
          fi
      - name: run the roots whose cones this PR touched
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'heavy-cone') }}
        run: |
          files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- alloy | tr '\n' ' ')"
          echo "changed alloy files: ${files:-none}"
          make check-affected FILES="$files"
