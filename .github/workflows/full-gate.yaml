# Registered on GitHub by this touch (R02-D13, MP 2026-10-02, option A): the file predates the repository's creation on GitHub and had never run.
# Tier 3 — the FULL gate in CI, on demand (workflow_dispatch only, per MP 2026-08-14:
# no schedule). Shards `make check-alloy` by top-level alloy family across matrix jobs
# so each stays under the 6-hour job limit on 2-core hosted runners, plus the cookbook
# (check-examples). Informational tier: not in the ruleset's required checks — the
# local `make check-alloy` remains THE push gate.
name: full-gate

on:
  workflow_dispatch:
    inputs:
      solver:
        description: "SAT solver"
        type: choice
        default: auto
        options:
          - auto
          - glucose
          - sat4j

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      families: ${{ steps.list.outputs.families }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: discover the family shards (top-level dirs holding test roots)
        run: |
          fams=$(find alloy -path '*/tests/*.als' ! -path '*/legacy/*' ! -path 'alloy/soak/*' \
                 | cut -d/ -f2 | sort -u | jq -R . | jq -cs .)
          echo "families=$fams" >> "$GITHUB_OUTPUT"
          echo "shards: $fams"

  gate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.shard.outputs.families) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            tools/alloy.jar
            tools/robot.jar
          key: tools-${{ hashFiles('tools/get-tools.sh') }}
      - run: make tools
      - name: pick solver
        run: |
          case "${{ inputs.solver }}" in
            glucose) echo "ALLOY_FLAGS=-s glucose" >> "$GITHUB_ENV"; echo "solver: glucose (forced)";;
            sat4j)   echo "ALLOY_FLAGS=" >> "$GITHUB_ENV"; echo "solver: SAT4J (forced)";;
            *)
              printf 'sig A {}\nrun probe { some A } for 2 expect 1\n' > /tmp/probe.als
              mkdir -p /tmp/probe-out
              if java -jar tools/alloy.jar exec -s glucose -c probe -o /tmp/probe-out -f /tmp/probe.als >/dev/null 2>&1; then
                echo "ALLOY_FLAGS=-s glucose" >> "$GITHUB_ENV"; echo "solver: glucose (native loaded)"
              else
                echo "ALLOY_FLAGS=" >> "$GITHUB_ENV"; echo "solver: SAT4J (glucose native failed to load)"
              fi;;
          esac
      - name: full gate — ${{ matrix.family }} shard
        run: make check-alloy CHECK_SCOPE="alloy/${{ matrix.family }}"

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            tools/alloy.jar
            tools/robot.jar
          key: tools-${{ hashFiles('tools/get-tools.sh') }}
      - run: make tools
      - name: cookbook (meta contract)
        run: make check-examples
