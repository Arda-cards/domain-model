# The pointer parity check, started from here (the project owner's ruling on card QA814, option (a)).
#
# The check itself lives in dafny-domain (its workflow pointer-parity.yaml, tools/check-pointer-parity.py): a text check
# that every pointer the Dafny reference model carries to this model, and every pointer this model carries back
# (`// Reflects dafny-domain`, `// Refines Dafny:`, `// Extension class n: ... for`), names something that exists on the
# other side. It runs there because dafny-domain can read both repositories and this one cannot read dafny-domain.
#
# This workflow starts that check for THIS repository's commit and waits for it, so a pull request here that renames or
# removes something the Dafny model points at fails before it merges. The mechanism is the one operations and
# accounts-component use to start api-test's suite: a `gh workflow run` with a token that may start workflows in the
# other repository, then `gh run watch --exit-status`.
#
# The secret ARDA_API_TEST_WORKFLOW_DISPATCH is that token: the key operations and accounts-component use for api-test,
# which the project owner widened to dafny-domain (card QA814). A pull request from a fork has no secrets, so the job is
# skipped for it: a skipped job, never a green one.
name: pointer-parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pointer-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start dafny-domain's pointer parity check for this commit, and wait for it
        env:
          GITHUB_TOKEN: ${{ secrets.ARDA_API_TEST_WORKFLOW_DISPATCH }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          [ -n "${GITHUB_TOKEN:-}" ] || { echo "::error::the secret ARDA_API_TEST_WORKFLOW_DISPATCH is not set: the check did not run"; exit 1; }
          url="$(gh workflow run pointer-parity.yaml \
            --repo Arda-cards/dafny-domain --ref main \
            -f domain_model_ref="$HEAD_SHA")"
          echo "::notice title=Started dafny-domain's pointer parity check::$url"
          id="${url##*/}"
          [ -n "$id" ] && [ "$id" != "$url" ] || { echo "::error::no run id from $url"; exit 1; }
          gh run watch "$id" --repo Arda-cards/dafny-domain --exit-status
